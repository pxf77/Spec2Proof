name: One-time stage two rescue finalizer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec2proof-stage2-rescue-finalizer
  cancel-in-progress: false

jobs:
  repair-verify-merge-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Inspect pull request state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pulls/1 \
            > /tmp/pr.json
          node - <<'NODE'
          const fs = require('fs');
          const pr = JSON.parse(fs.readFileSync('/tmp/pr.json', 'utf8'));
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `merged=${pr.merged_at ? 'true' : 'false'}\n`);
          fs.appendFileSync(out, `head_sha=${pr.head.sha}\n`);
          NODE

      - name: Checkout feature branch
        if: steps.pr.outputs.merged != 'true'
        uses: actions/checkout@v4
        with:
          ref: feat/github-app-pr-flow
          fetch-depth: 0

      - name: Apply scoped repairs
        if: steps.pr.outputs.merged != 'true'
        shell: python
        run: |
          from pathlib import Path

          webhook = Path("src/apps/webhook.ts")
          text = webhook.read_text()
          text = text.replace(
              "SPEC2PROOOF_AGENT_RUNTIME_TIMEOUT_SECONDS",
              "SPEC2PROOF_AGENT_RUNTIME_TIMEOUT_SECONDS",
          )
          webhook.write_text(text)

          dispatcher = Path("src/github/dispatcher.ts")
          text = dispatcher.read_text()
          text = text.replace("\n    context = {\n", "\n    const context = {\n", 1)
          text = text.replace(
              "\n    client = this.dependencies.clients.forInstallation(context.installationId);\n",
              "\n    const client = this.dependencies.clients.forInstallation(context.installationId);\n",
              1,
          )
          dispatcher.write_text(text)

      - name: Set up Node.js for branch verification
        if: steps.pr.outputs.merged != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install branch dependencies
        if: steps.pr.outputs.merged != 'true'
        run: npm install

      - name: Verify feature branch
        if: steps.pr.outputs.merged != 'true'
        run: npm run check

      - name: Push verified repairs
        if: steps.pr.outputs.merged != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/webhook.ts src/github/dispatcher.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: repair GitHub dispatcher type errors"
            git push origin HEAD:feat/github-app-pr-flow
          fi

      - name: Merge verified pull request
        if: steps.pr.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pulls/1/merge \
            --data "{\"merge_method\":\"squash\",\"sha\":\"${HEAD_SHA}\",\"commit_title\":\"feat: implement GitHub App PR acceptance flow\"}")
          echo "${RESPONSE}" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.merged !== true) {
                console.error(result);
                process.exit(1);
              }
              console.log(`Merged as ${result.sha}`);
            });
          '

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Refresh latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Node.js for main verification
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main dependencies
        run: npm install

      - name: Verify merged main
        run: npm run check

      - name: Remove all one-time workflows from main
        run: |
          rm -f .github/workflows/repair-github-flow.yml
          rm -f .github/workflows/cleanup-github-flow-repair.yml
          rm -f .github/workflows/finalize-stage2.yml
          rm -f .github/workflows/finalize-stage2-v2.yml
          rm -f .github/workflows/verify-stage2-main.yml
          rm -f .github/workflows/stage2-rescue-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time stage two workflows"
            git push origin HEAD:main
          fi
