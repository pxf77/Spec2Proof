name: One-time verified stage two finalizer

on:
  push:
    branches:
      - feat/github-app-pr-flow
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec2proof-stage2-finalizer
  cancel-in-progress: false

jobs:
  verify-clean-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/github-app-pr-flow
          fetch-depth: 0

      - name: Refresh branch
        run: |
          git fetch origin feat/github-app-pr-flow
          git reset --hard origin/feat/github-app-pr-flow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify typecheck, tests, and build
        run: npm run check

      - name: Remove one-time workflows from final tree
        run: |
          rm -f .github/workflows/repair-github-flow.yml
          rm -f .github/workflows/cleanup-github-flow-repair.yml
          rm -f .github/workflows/finalize-stage2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-github-flow.yml \
                  .github/workflows/cleanup-github-flow-repair.yml \
                  .github/workflows/finalize-stage2.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time stage two workflows"
            git push origin HEAD:feat/github-app-pr-flow
          fi

      - name: Merge verified pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pulls/1/merge \
            --data "{\"merge_method\":\"squash\",\"sha\":\"${HEAD_SHA}\",\"commit_title\":\"feat: implement GitHub App PR acceptance flow\"}")
          echo "${RESPONSE}" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.merged !== true) {
                console.error(result);
                process.exit(1);
              }
              console.log(`Merged as ${result.sha}`);
            });
          '
