name: DemoShop E2E

on:
  pull_request:
    paths:
      - "demo-shop/**"
      - "e2e/**"
      - "scripts/serve-demo-shop.mjs"
      - "package.json"
      - "tsconfig.e2e.json"
      - ".github/workflows/demo-shop-e2e.yml"
  push:
    branches: [main]
    paths:
      - "demo-shop/**"
      - "e2e/**"
      - "scripts/serve-demo-shop.mjs"
      - "package.json"
      - "tsconfig.e2e.json"
      - ".github/workflows/demo-shop-e2e.yml"

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check:e2e
