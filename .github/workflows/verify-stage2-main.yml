name: One-time stage two main verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec2proof-stage2-main-verification
  cancel-in-progress: false

jobs:
  wait-verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wait for stage two pull request to merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            MERGED=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pulls/1 \
              | node -e '
                  let input = "";
                  process.stdin.on("data", chunk => input += chunk);
                  process.stdin.on("end", () => {
                    const pr = JSON.parse(input);
                    process.stdout.write(pr.merged_at ? "true" : "false");
                  });
                ')
            if [ "${MERGED}" = "true" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "PR #1 did not merge within the verification window." >&2
          exit 1

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify typecheck, tests, and build
        run: npm run check

      - name: Remove one-time verification workflow
        run: |
          rm -f .github/workflows/verify-stage2-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "chore: remove one-time stage two main verification"
          git push origin HEAD:main
